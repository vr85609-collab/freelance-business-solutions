name: Aqua Arcade validation and Android package
on:
  pull_request:
    branches: [aquaemoticons-play-win]
    paths: ['aqua-play-win/**', '.github/workflows/aqua-arcade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aqua-play-win
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arcade
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: arcade_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      REWARDS_TEST_DATABASE_URL: postgres://arcade:local-test-only@localhost:5432/arcade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aqua-play-win/package-lock.json
      - run: npm ci
      - name: Verify production database initialization
        run: npm run rewards:prepare
        env:
          DATABASE_URL: postgres://arcade:local-test-only@localhost:5432/arcade_test
          ARCADE_MIGRATE_ON_START: 'true'
      - run: npm test
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aqua-play-win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:sync
      - run: gradle -p android :app:lintRelease :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aqua-arcade-android-review
          path: |
            aqua-play-win/android/app/build/outputs/apk/debug/*.apk
            aqua-play-win/android/app/build/outputs/bundle/release/*.aab
            aqua-play-win/android/app/build/reports/lint-results-release.html
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aqua-play-win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci
      - run: npm run android:sync
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: aqua-play-win
          script: bash scripts/android-device-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-arcade-device-review
          path: |
            aqua-play-win/android/device-screenshots/*.png
            aqua-play-win/android/app/build/reports/androidTests/
            aqua-play-win/android/app/build/outputs/androidTest-results/
            aqua-play-win/android/instrumentation-result.txt
